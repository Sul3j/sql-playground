# Serwer MySQL dla SQL Playground.
# Port wystawiony tylko lokalnie (127.0.0.1) — uczniowie łączą się przez aplikację, nie bezpośrednio z bazą.
services:
  mysql:
    image: mysql:8.4
    container_name: sql-playground-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: playground
    # lower-case-table-names=1: nazwy tabel bez rozróżniania wielkości liter, jak w MySQL na Windows
    command: ["--lower-case-table-names=1"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pplayground"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
